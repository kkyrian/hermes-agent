# Anonymized cold-start policy example for the public repository.
# Concrete managed-profile policy belongs in the private deployment repository.
skills:
  prompt_exposure:
    default: description
    hidden:
      - skill-hidden-example
    names_only:
      - skill-name-only-example
    descriptions:
      - skill-description-example
    conditional:
      external-worker-example:
        tier: description
        requires_toolsets: [terminal]
        requires_executables: [external-worker]
